<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Comunidad UAM</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/estudiante.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
    <header class="encabezado">
        <div class="logo-header">
            <h2>Comunidad UAM Activa</h2>
        </div>
        <div class="usuario-info">
            <span id="nombreEstudiante">Cargando...</span>
            <a href="estudiante.html" class="boton-volver">Volver al inicio</a>
        </div>
    </header>

    <main class="contenedor-perfil">
        <section class="panel-formulario-perfil">
            <div class="titulo-seccion">
                <span class="linea"></span>
                <h2>Gestión de Datos Personales</h2>
                <span class="linea"></span>
            </div>

            <form id="formPerfil">
                <div class="campo">
                    <label for="nombrePerfil">Nombre completo</label>
                    <input type="text" id="nombrePerfil" required>
                    <span class="error" id="errorNombre"></span>
                </div>

                <div class="campo">
                    <label for="correoPerfil">Correo institucional (No modificable)</label>
                    <input type="email" id="correoPerfil" disabled style="background: #e9e9e9; cursor: not-allowed;">
                </div>

                <div class="campo">
                    <label for="passwordPerfil">Nueva contraseña (Dejar en blanco si no deseas cambiarla)</label>
                    <input type="password" id="passwordPerfil" placeholder="Mínimo 8 caracteres, una mayúscula y un número">
                    <span class="error" id="errorPassword"></span>
                </div>

                <button type="submit" class="boton boton-registro">Guardar Cambios</button>
                <p id="mensajePerfil" class="mensaje"></p>
            </form>
        </section>
    </main>

    <script src="js/perfil.js"></script>
</body>
</html>
