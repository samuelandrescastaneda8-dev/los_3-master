<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Comunidad UAM</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor-principal">
        <div class="tarjeta-acceso">
            <div class="logo-contenedor">
                <h2>Comunidad UAM Activa</h2>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form id="formLogin">
                <div class="campo">
                    <label for="correoLogin">Correo institucional</label>
                    <input type="email" id="correoLogin" placeholder="tu.correo@uam.edu.co" required>
                </div>

                <div class="campo">
                    <label for="passwordLogin">Contraseña</label>
                    <input type="password" id="passwordLogin" placeholder="********" required>
                </div>

                <button type="submit" class="boton">Iniciar Sesión</button>
                <p id="mensajeLogin" class="mensaje"></p>
            </form>

            <!-- Enlace para ir al registro -->
            <div class="enlace-cambio">
                <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </div>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
